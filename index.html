<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBCB 2026 BEIJING | Mikkeller Beer Celebration Beijing</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0d0d0d;
            --bg-card: #1a1a1a;
            --bg-card-hover: #222;
            --accent-gold: #c9a96e;
            --accent-gold-light: #e8d5a3;
            --text-primary: #f5f5f5;
            --text-secondary: #a0a0a0;
            --text-muted: #666;
            --border: #2a2a2a;
            --tag-bg: #2d2d2d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.7;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(180deg, #1a1a1a 0%, var(--bg-dark) 100%);
            padding: 60px 20px 40px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--accent-gold);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .header .subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .header .desc {
            margin-top: 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .stat-item { text-align: center; }
        .stat-number {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--accent-gold);
            font-weight: 700;
        }
        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 4px;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 30px 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--tag-bg);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--accent-gold);
            color: var(--bg-dark);
            border-color: var(--accent-gold);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 60px;
        }

        .brewery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 24px;
        }

        .brewery-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.4s ease;
            cursor: pointer;
        }

        .brewery-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-gold);
            box-shadow: 0 20px 40px rgba(201, 169, 110, 0.1);
        }

        .card-header {
            padding: 24px 24px 16px;
            position: relative;
        }

        .country-flag {
            font-size: 1.2rem;
            line-height: 1;
        }

        .brewery-name-en {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            color: var(--accent-gold);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .brewery-name-zh {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 300;
        }

        .location {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .location-icon { color: var(--accent-gold); }

        .card-body {
            padding: 0 24px 20px;
        }

        .tag-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 16px;
        }

        .tag {
            background: var(--tag-bg);
            color: var(--text-secondary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            border: 1px solid var(--border);
        }

        .tag.highlight {
            background: rgba(201, 169, 110, 0.15);
            color: var(--accent-gold-light);
            border-color: var(--accent-gold);
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-gold);
            margin: 16px 0 8px;
            font-weight: 500;
        }

        .story-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.8;
        }

        .founder-box {
            background: rgba(201, 169, 110, 0.05);
            border-left: 3px solid var(--accent-gold);
            padding: 12px 16px;
            margin: 12px 0;
            border-radius: 0 8px 8px 0;
        }

        .founder-name {
            color: var(--accent-gold-light);
            font-weight: 500;
            font-size: 0.9rem;
        }

        .founder-desc {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-top: 4px;
        }

        .card-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .year-badge {
            background: var(--accent-gold);
            color: var(--bg-dark);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .detail-btn {
            color: var(--accent-gold);
            font-size: 0.85rem;
            cursor: pointer;
            transition: color 0.3s;
        }

        .detail-btn:hover { color: var(--accent-gold-light); }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            overflow-y: auto;
            backdrop-filter: blur(8px);
        }

        .modal-overlay.active { display: block; }

        .modal-content {
            max-width: 900px;
            margin: 40px auto;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: var(--tag-bg);
            border: 1px solid var(--border);
            color: var(--text-primary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: all 0.3s;
        }

        .modal-close:hover {
            background: var(--accent-gold);
            color: var(--bg-dark);
        }

        .modal-header {
            padding: 32px 32px 20px;
            background: linear-gradient(180deg, rgba(201,169,110,0.1) 0%, transparent 100%);
        }

        /* Tabs */
        .tabs-nav {
            display: flex;
            gap: 0;
            border-bottom: 1px solid var(--border);
            padding: 0 32px;
            overflow-x: auto;
        }

        .tab-btn {
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text-muted);
            padding: 14px 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: 'Noto Sans SC', sans-serif;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .tab-btn:hover { color: var(--text-secondary); }
        .tab-btn.active {
            color: var(--accent-gold);
            border-bottom-color: var(--accent-gold);
        }

        .tab-panel {
            display: none;
            padding: 24px 32px 32px;
            animation: fadeIn 0.3s ease;
        }

        .tab-panel.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-body .section-title {
            font-size: 0.8rem;
            margin-top: 20px;
        }

        .modal-body .story-text {
            font-size: 0.9rem;
        }

        .timeline {
            position: relative;
            padding-left: 24px;
            margin: 16px 0;
        }

        .timeline::before {
            content: "";
            position: absolute;
            left: 6px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--accent-gold);
            opacity: 0.3;
        }

        .timeline-item {
            position: relative;
            padding-bottom: 16px;
        }

        .timeline-item::before {
            content: "";
            position: absolute;
            left: -22px;
            top: 6px;
            width: 10px;
            height: 10px;
            background: var(--accent-gold);
            border-radius: 50%;
        }

        .timeline-year {
            font-family: 'Playfair Display', serif;
            color: var(--accent-gold);
            font-weight: 700;
            font-size: 1rem;
        }

        .timeline-text {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .awards-list {
            list-style: none;
        }

        .awards-list li {
            font-size: 0.85rem;
            color: var(--text-secondary);
            padding: 6px 0;
            padding-left: 24px;
            position: relative;
        }

        .awards-list li::before {
            content: "🏆";
            position: absolute;
            left: 0;
            font-size: 0.8rem;
        }

        /* Beer Cards in Modal */
        .beer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .beer-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            transition: all 0.3s;
        }

        .beer-card:hover {
            border-color: var(--accent-gold);
            background: rgba(201,169,110,0.05);
        }

        .beer-name {
            font-family: 'Playfair Display', serif;
            color: var(--accent-gold-light);
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .beer-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }

        .beer-meta span {
            background: var(--tag-bg);
            color: var(--text-muted);
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
        }

        .beer-meta .rating {
            background: rgba(201,169,110,0.2);
            color: var(--accent-gold);
        }

        .beer-desc {
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        .beer-desc .label {
            color: var(--accent-gold);
            font-weight: 500;
        }

        .footer {
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        @media (max-width: 768px) {
            .header { padding: 40px 16px 30px; }
            .header h1 { font-size: 1.6rem; letter-spacing: 1px; }
            .header .subtitle { font-size: 0.8rem; letter-spacing: 2px; }
            .header .desc { font-size: 0.8rem; padding: 0 10px; }
            
            .stats-bar { gap: 20px; margin-top: 20px; }
            .stat-number { font-size: 1.5rem; }
            .stat-label { font-size: 0.65rem; letter-spacing: 1px; }
            
            .filters { padding: 20px 12px; gap: 8px; }
            .filter-btn { padding: 6px 14px; font-size: 0.75rem; }
            
            .container { padding: 0 12px 40px; }
            .brewery-grid { grid-template-columns: 1fr; gap: 16px; }
            
            .card-header { padding: 18px 18px 12px; }
            .brewery-name-en { font-size: 1.3rem; }
            .brewery-name-zh { font-size: 0.8rem; }
            .card-body { padding: 0 18px 16px; }
            .tag { font-size: 0.7rem; padding: 3px 10px; }
            .founder-box { padding: 10px 12px; }
            .founder-name { font-size: 0.85rem; }
            .founder-desc { font-size: 0.75rem; }
            .story-text { font-size: 0.8rem; line-height: 1.7; }
            .card-footer { padding: 12px 18px; }
            .year-badge { font-size: 0.7rem; padding: 3px 10px; }
            .detail-btn { font-size: 0.8rem; }
            
            .modal-content { margin: 0; border-radius: 0; min-height: 100vh; }
            .modal-close { top: 12px; right: 12px; width: 36px; height: 36px; font-size: 1rem; }
            .modal-header { padding: 24px 16px 16px; }
            .modal-header h2 { font-size: 1.6rem !important; }
            .modal-header p { font-size: 0.9rem !important; }
            
            .tabs-nav { padding: 0 12px; gap: 4px; }
            .tab-btn { padding: 10px 12px; font-size: 0.75rem; }
            .tab-panel { padding: 16px 12px 24px; }
            
            .timeline { padding-left: 18px; }
            .timeline-item::before { left: -18px; width: 8px; height: 8px; }
            .timeline-year { font-size: 0.9rem; }
            .timeline-text { font-size: 0.8rem; }
            
            .section-title { font-size: 0.7rem; margin-top: 14px; }
            .modal-body .story-text { font-size: 0.85rem; }
            
            .beer-grid { grid-template-columns: 1fr; gap: 12px; }
            .beer-card { padding: 14px; }
            .beer-name { font-size: 1rem; }
            .beer-meta span { font-size: 0.7rem; padding: 2px 8px; }
            .beer-desc { font-size: 0.75rem; line-height: 1.6; }
            .beer-desc p { margin-bottom: 4px; }
            
            .awards-list li { font-size: 0.75rem; padding: 3px 0 3px 20px; }
            
            .footer { padding: 30px 16px; font-size: 0.75rem; }
        }

        @media (max-width: 480px) {
            .header h1 { font-size: 1.4rem; }
            .stats-bar { gap: 16px; }
            .stat-number { font-size: 1.3rem; }
            .brewery-name-en { font-size: 1.2rem; }
            .tab-btn { padding: 8px 10px; font-size: 0.7rem; }
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brewery-card {
            animation: cardFadeIn 0.6s ease forwards;
        }

        .brewery-card:nth-child(1) { animation-delay: 0.1s; }
        .brewery-card:nth-child(2) { animation-delay: 0.2s; }
        .brewery-card:nth-child(3) { animation-delay: 0.3s; }
        .brewery-card:nth-child(4) { animation-delay: 0.4s; }
        .brewery-card:nth-child(5) { animation-delay: 0.5s; }
    </style>
</head>

function getBreweryAge(founded) {
    const match = founded.match(/(\d{4})/);
    if (!match) return founded;
    const year = parseInt(match[1]);
    const age = 2026 - year;
    return `建厂${age}年`;
}

function renderBreweries(filter = 'all') {
    const grid = document.getElementById('breweryGrid');
    const filtered = filter === 'all' ? breweries : breweries.filter(b => b.countryCode === filter);
    
    grid.innerHTML = filtered.map(b => `
        <div class="brewery-card" data-country="${b.countryCode}" onclick="openModal('${b.id}')">
            <div class="card-header">
                <div class="brewery-name-en">${b.nameEn}</div>
                <div class="brewery-name-zh">${b.nameZh}</div>
                <div class="location">
                    <span class="country-flag">${b.country.split(' ')[0]}</span>
                    <span class="location-icon">📍</span>
                    <span>${b.location}</span>
                </div>
            </div>
            <div class="card-body">
                <div class="tag-row">
                    ${b.tags.map(t => `<span class="tag">${t}</span>`).join('')}
                    <span class="tag highlight">${b.highlight}</span>
                </div>
                
                <div class="section-title">创始人</div>
                <div class="founder-box">
                    <div class="founder-name">${b.founder}</div>
                    <div class="founder-desc">${b.founderDesc}</div>
                </div>
                
                <div class="section-title">故事梗概</div>
                <p class="story-text">${b.shortStory}</p>
            </div>
            <div class="card-footer">
                <span class="year-badge">${getBreweryAge(b.founded)}</span>
                <span class="detail-btn">查看详情 →</span>
            </div>
        </div>
    `).join('');
}

function openModal(id) {
    const b = breweries.find(x => x.id === id);
    if (!b) return;
    
    const story = b.fullStory;
    
    let tab1Content = `
        <div class="section-title">命名由来</div>
        <p class="story-text">${story.nameOrigin}</p>
        
        <div class="section-title">创始人历程</div>
        <div class="timeline">
            ${story.founderJourney.map(item => `
                <div class="timeline-item">
                    <div class="timeline-year">${item.year}</div>
                    <div class="timeline-text">${item.text}</div>
                </div>
            `).join('')}
        </div>
    `;
    
    if (story.familyLegacy) {
        tab1Content += `
            <div class="section-title">家族传承</div>
            <p class="story-text">${story.familyLegacy}</p>
        `;
    }
    
    if (story.teamDynamic) {
        tab1Content += `
            <div class="section-title">团队动态</div>
            <p class="story-text">${story.teamDynamic}</p>
        `;
    }
    
    let tab2Content = `
        <div class="section-title">酿造哲学</div>
        <p class="story-text">${story.philosophy}</p>
    `;
    
    if (story.taproom) {
        tab2Content += `
            <div class="section-title">品酒室特色</div>
            <p class="story-text">${story.taproom}</p>
        `;
    }
    
    if (story.ahaMoment) {
        tab2Content += `
            <div class="section-title">顿悟时刻</div>
            <p class="story-text">${story.ahaMoment}</p>
        `;
    }
    
    if (story.metalTheme) {
        tab2Content += `
            <div class="section-title">重金属主题</div>
            <p class="story-text">${story.metalTheme}</p>
        `;
    }
    
    if (story.oaklandScene) {
        tab2Content += `
            <div class="section-title">奥克兰啤酒场景</div>
            <p class="story-text">${story.oaklandScene}</p>
        `;
    }
    
    const tab3Content = `
        <ul class="awards-list">
            ${story.awards.map(a => `<li>${a}</li>`).join('')}
        </ul>
    `;
    
    const tab4Content = `
        <div class="beer-grid">
            ${story.beers.map(beer => `
                <div class="beer-card">
                    <div class="beer-name">${beer.name}</div>
                    <div class="beer-meta">
                        <span>${beer.style}</span>
                        <span>ABV ${beer.abv}</span>
                        ${beer.ibu !== 'N/A' ? `<span>IBU ${beer.ibu}</span>` : ''}
                        <span class="rating">${beer.rating}</span>
                    </div>
                    <div class="beer-desc">
                        <p><span class="label">酒花：</span>${beer.hops}</p>
                        <p><span class="label">工艺：</span>${beer.process}</p>
                        <p><span class="label">风味：</span>${beer.flavor}</p>
                    </div>
                </div>
            `).join('')}
        </div>
    `;
    
    const content = `
        <div class="modal-header">
            <span style="font-size:2rem">${b.country.split(' ')[0]}</span>
            <h2 style="font-family:'Playfair Display',serif;font-size:2.2rem;color:var(--accent-gold);margin-top:8px">${b.nameEn}</h2>
            <p style="color:var(--text-secondary);font-size:1.1rem">${b.nameZh} · ${b.location}</p>
        </div>
        <div class="tabs-nav">
            <button class="tab-btn active" onclick="switchTab(0)">代表酒款</button>
            <button class="tab-btn" onclick="switchTab(1)">酒厂故事</button>
            <button class="tab-btn" onclick="switchTab(2)">酿造哲学</button>
            <button class="tab-btn" onclick="switchTab(3)">荣誉奖项</button>
        </div>
        <div class="tab-panel active" data-tab="0">${tab4Content}</div>
        <div class="tab-panel" data-tab="1">${tab1Content}</div>
        <div class="tab-panel" data-tab="2">${tab2Content}</div>
        <div class="tab-panel" data-tab="3">${tab3Content}</div>
    `;
    
    document.getElementById('modalContent').innerHTML = content;
    document.getElementById('modal').classList.add('active');
    document.body.style.overflow = 'hidden';
}

function switchTab(index) {
    document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === index);
    });
    document.querySelectorAll('.tab-panel').forEach((panel, i) => {
        panel.classList.toggle('active', i === index);
    });
}

function closeModal(event) {
    if (event && event.target !== event.currentTarget && event.target.className !== 'modal-close') return;
    document.getElementById('modal').classList.remove('active');
    document.body.style.overflow = '';
}

function filterBreweries(country) {
    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    renderBreweries(country);
}

renderBreweries();
</script>
</body>
